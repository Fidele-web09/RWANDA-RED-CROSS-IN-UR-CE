<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - Rwanda Red Cross UR-CE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="navbar">

        <div class="navbar-container">

            <a href="index.html" class="logo">

                <div class="cross-symbol">+</div>

                <div class="logo-text">
                    <strong>RWANDA RED CROSS</strong>
                    <span>UR-CE</span>
                </div>

            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="signup.html" class="nav-join">
                    Sign Up
                </a>
            </nav>

        </div>

    </header>


    <!-- ================= LOGIN ================= -->
    <main>

        <section class="section">

            <div class="section-heading">

                <span>WELCOME BACK</span>

                <h2>
                    Log In
                </h2>

                <p>
                    Access your Rwanda Red Cross UR-CE account.
                </p>

            </div>


            <div class="auth-container">

                <form id="loginForm" class="auth-form">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Remember -->
                    <div class="form-checkbox">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <label for="rememberMe">
                            Remember me
                        </label>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="btn btn-red auth-button"
                    >
                        Log In
                    </button>


                    <!-- Login Message -->
                    <p id="loginMessage"></p>


                    <!-- Sign Up -->
                    <p class="auth-switch">

                        Don't have an account?

                        <a href="signup.html">
                            Create an account
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

        <div class="footer-cross">
            +
        </div>

        <div class="footer-title">
            Rwanda Red Cross
        </div>

        <div class="footer-subtitle">
            University of Rwanda - College of Education
        </div>

        <p class="copyright">
            © 2026 Rwanda Red Cross - UR-CE.
            All rights reserved.
        </p>

    </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>

</body>
</html>
