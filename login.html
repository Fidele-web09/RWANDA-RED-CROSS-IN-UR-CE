<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Login | Rwanda Red Cross UR-CE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #7f0000, #d71920, #a90000);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* =================================
           MOVING RED CROSS SYMBOLS
        ================================= */

        .floating-cross {
            position: absolute;
            color: rgba(255, 255, 255, 0.13);
            font-size: 70px;
            font-weight: bold;
            animation: floatCross 12s infinite linear;
            user-select: none;
        }

        .cross1 {
            left: 5%;
            top: 15%;
            animation-delay: 0s;
        }

        .cross2 {
            left: 85%;
            top: 10%;
            font-size: 100px;
            animation-delay: 2s;
        }

        .cross3 {
            left: 15%;
            bottom: 10%;
            font-size: 90px;
            animation-delay: 4s;
        }

        .cross4 {
            right: 10%;
            bottom: 15%;
            font-size: 65px;
            animation-delay: 6s;
        }

        .cross5 {
            left: 48%;
            top: 5%;
            font-size: 50px;
            animation-delay: 8s;
        }

        @keyframes floatCross {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.15;
            }

            50% {
                transform: translateY(-40px) rotate(180deg);
                opacity: 0.35;
            }

            100% {
                transform: translateY(0) rotate(360deg);
                opacity: 0.15;
            }

        }


        /* =================================
           LOGIN CONTAINER
        ================================= */

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }


        /* =================================
           BRAND
        ================================= */

        .brand-cross {
            width: 75px;
            height: 75px;
            background: #d71920;
            color: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
            margin: 0 auto 18px;
            box-shadow: 0 10px 25px rgba(215, 25, 32, 0.35);
        }

        .login-card h1 {
            color: #8b0000;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .login-card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }


        /* =================================
           FORM
        ================================= */

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #d71920;
            box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.12);
        }


        /* =================================
           LOGIN BUTTON
        ================================= */

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            background: #d71920;
            color: white;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #a90000;
            transform: translateY(-2px);
        }


        /* =================================
           MESSAGE
        ================================= */

        #loginMessage {
            min-height: 22px;
            margin-top: 15px;
            font-size: 14px;
        }


        /* =================================
           LINKS
        ================================= */

        .login-links {
            margin-top: 22px;
            font-size: 14px;
        }

        .login-links a {
            color: #d71920;
            text-decoration: none;
            font-weight: bold;
        }

        .login-links a:hover {
            text-decoration: underline;
        }


        .back-home {
            margin-top: 18px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }


        /* =================================
           FOOTER
        ================================= */

        .login-footer {
            margin-top: 25px;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 500px) {

            .login-card {
                padding: 32px 22px;
            }

            .login-card h1 {
                font-size: 23px;
            }

            .floating-cross {
                font-size: 50px;
            }

        }

    </style>

</head>


<body>


    <!-- MOVING RED CROSS SYMBOLS -->

    <div class="floating-cross cross1">✚</div>
    <div class="floating-cross cross2">✚</div>
    <div class="floating-cross cross3">✚</div>
    <div class="floating-cross cross4">✚</div>
    <div class="floating-cross cross5">✚</div>


    <!-- LOGIN -->

    <div class="login-wrapper">

        <div class="login-card">


            <div class="brand-cross">
                ✚
            </div>


            <h1>
                UR-CE Red Cross
            </h1>

            <p class="subtitle">
                Member Login Portal
            </p>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>


                <p id="loginMessage"></p>


            </form>


            <div class="login-links">

                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Create Account
                    </a>
                </p>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to UR-CE Red Cross Website
                </a>

            </div>


            <div class="login-footer">

                Rwanda Red Cross – University of Rwanda
                College of Education, Rukara Campus

            </div>


        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="script.js"></script>


</body>

</html>

<a href="forgot-password.html" class="forgot-password">
    Forgot Password?
</a>
