<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Rwanda Red Cross UR-CE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <div class="navbar-container">

            <a href="index.html" class="logo">

                <div class="cross-symbol">+</div>

                <div class="logo-text">
                    <strong>RWANDA RED CROSS</strong>
                    <span>UR-CE</span>
                </div>

            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Log In</a>
            </nav>

        </div>

    </header>


    <!-- Sign Up Section -->
    <main>

        <section class="section">

            <div class="section-heading">

                <span>JOIN OUR COMMUNITY</span>

                <h2>
                    Create Your Account
                </h2>

                <p>
                    Sign up to participate in Rwanda Red Cross
                    activities at UR-CE.
                </p>

            </div>


            <div class="auth-container">

                <form id="signupForm" class="auth-form">

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Student ID -->
                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            name="studentId"
                            placeholder="Enter your student ID"
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                            minlength="8"
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                            minlength="8"
                        >

                    </div>


                    <!-- Account Type -->
                    <div class="form-group">

                        <label for="role">
                            Account Type
                        </label>

                        <select id="role" name="role" required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="volunteer">
                                Volunteer
                            </option>

                            <option value="member">
                                Red Cross Member
                            </option>

                        </select>

                    </div>


                    <!-- Terms -->
                    <div class="form-checkbox">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">
                            I agree to the website terms and
                            conditions.
                        </label>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="btn btn-red auth-button"
                    >
                        Create Account
                    </button>


                    <!-- Message -->
                    <p id="signupMessage"></p>


                    <!-- Login -->
                    <p class="auth-switch">

                        Already have an account?

                        <a href="login.html">
                            Log In
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-cross">
            +
        </div>

        <div class="footer-title">
            Rwanda Red Cross
        </div>

        <div class="footer-subtitle">
            University of Rwanda - College of Education
        </div>

        <p class="copyright">
            © 2026 Rwanda Red Cross - UR-CE.
            All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
